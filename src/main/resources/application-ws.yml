server:
  appName: keeper-gateway-service
  port: 8080
  ip: 192.168.100.27
  logging:
    level: info
    filePath: ../logs/gateway/gateway.log

spring:
  cloud:
    gateway:
      routes:
        - id: eureka-server
          uri: http://${server.ip}:8761
          predicates:
            Path=/eureka/web
          filters:
            SetPath=/

        - id: eureka-server-static
          uri: http://${server.ip}:8761
          predicates:
            - Path=/eureka/**

        - id: keeper-security-service
          uri: lb://keeper-security-service
          predicates:
            - Path=/api/auth/**

        - id: keeper-panda-service
          uri: lb://keeper-panda-service
          predicates:
            - Path=/api/panda/**

        - id: keeper-events-service
          uri: lb://keeper-events-service
          predicates:
            - Path=/api/events/**

        - id: knowledge-mcp-wms-vek
          uri: http://${server.ip}:18091
          predicates:
            - Path=/mcp/wms_vek,/mcp/wms_vek/**
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: 86400000
            connect-timeout: 10000

        - id: knowledge-mcp-wms-euro
          uri: http://${server.ip}:18092
          predicates:
            - Path=/mcp/wms_euro,/mcp/wms_euro/**
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: 86400000
            connect-timeout: 10000