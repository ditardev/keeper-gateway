server:
  appName: keeper-gateway-service
  port: 8080
  ip: localhost
  eureka:
    enabled: true
  logging:
    level: info
    filePath: ../logs/gateway/gateway.log

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 600s
        pool:
          type: elastic
          max-idle-time: 300s
      routes:
        - id: eureka-server
          uri: http://${server.ip}:8761
          predicates:
            Path=/eureka/web
          filters:
            SetPath=/

        - id: eureka-server-static
          uri: http://${server.ip}:8761
          predicates:
            - Path=/eureka/**

        - id: keeper-security-service
          uri: lb://keeper-security-service
          predicates:
            - Path=/api/v*/auth/**

        - id: keeper-panda-service
          uri: lb://keeper-panda-service
          predicates:
            - Path=/api/v*/panda/**

        - id: keeper-events-service
          uri: lb://keeper-events-service
          predicates:
            - Path=/api/v*/events/**

        - id: keeper-telbot-service
          uri: lb://keeper-telbot-service
          predicates:
            - Path=/api/v*/telbot**