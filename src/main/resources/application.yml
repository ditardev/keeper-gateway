#Spring Gateway Properties
spring:
  profiles:
    active: dev
  #    active: prod

  application:
    name: ${server.appName}
  codec:
    max-in-memory-size: 2GB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
server:
  shutdown: graceful
  version: ${projectVersion}
  servlet:
    session:
      timeout: 30s
#Eureka
eureka:
  client:
    should-enforce-registration-at-init: ${server.eureka.enabled}
    register-with-eureka: ${server.eureka.enabled}
    fetch-registry: ${server.eureka.enabled}
    enabled: ${server.eureka.enabled}
    should-unregister-on-shutdown: true
    registry-fetch-interval-seconds: 30
    eureka-service-url-poll-interval-seconds: 60
    service-url:
      defaultZone: http://${server.ip}:8761/eureka
  instance:
    statusPageUrlPath: gateway/info
    healthCheckUrlPath: gateway/health
    instance-id: "${spring.application.name}:${spring.profiles.active}:${random.uuid}"
    #http://localhost:8080/gateway/info/health
    hostname: ${server.eureka.hostname:${spring.cloud.client.hostname}}
    prefer-ip-address: ${server.eureka.prefer-ip:true}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
#Logging
logging:
  level:
    root: ${server.logging.level}
  file:
    name: ${server.logging.filePath}

#Prometheus
management:
  endpoint:
    info:
      enable: true
  endpoints:
    web:
      cors:
        allowed-origins: "*"
        allowed-headers: "*"
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      exposure:
        include: info,health,metrics,prometheus,loggers,gateway
      base-path: /gateway/info
  metrics:
    enable:
      jvm: true
